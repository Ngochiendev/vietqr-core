name: Publish to NuGet

on:
  push:
    branches: [main]
    paths:
      - 'src/VietQR.Core/**'
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version + release notes
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # Đã có tag thủ công -> dùng đúng version đó
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            # Tính version kế tiếp: major.minor từ csproj, patch = tag cuối + 1
            MAJMIN=$(awk -F'[<>]' '/<Version>/{print $3; exit}' src/VietQR.Core/VietQR.Core.csproj | cut -d. -f1-2)
            LAST=$(git describe --tags --match "v[0-9]*" --abbrev=0 2>/dev/null | sed 's/^v//' || true)
            if [ -z "$LAST" ]; then
              VERSION="${MAJMIN}.1"
            elif [[ "$LAST" == "${MAJMIN}."* ]]; then
              VERSION="${MAJMIN}.$(( ${LAST##*.} + 1 ))"
            else
              # Tag cuối thuộc major.minor khác (đã đổi trong csproj) -> chạm mốc mới .1
              VERSION="${MAJMIN}.1"
            fi
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          # Commit kể từ tag TRƯỚC (giữ prefix 'v' cho git)
          LAST_TAG=$(git describe --tags --match "v[0-9]*" --abbrev=0 2>/dev/null || true)
          if [ -n "$LAST_TAG" ] && git rev-list "$LAST_TAG..HEAD" >/dev/null 2>&1; then
            LOG=$(git log "$LAST_TAG..HEAD" --max-count=30 --pretty=format:'%s%n%h')
          else
            LOG=$(git log --max-count=5 --pretty=format:'%s%n%h')
          fi

          VERSION="$VERSION" LOG="$LOG" python3 - <<'PY'
          import html, os, re

          version = os.environ["VERSION"]
          raw = [l for l in os.environ.get("LOG", "").splitlines() if l.strip()]
          commits = [(raw[i].strip(), raw[i + 1].strip()) for i in range(0, len(raw) - 1, 2)]

          PREFIX = re.compile(r"^(feat|feature|fix|perf|refactor|build|ci|docs|chore|style|test)(\([^)]*\))?\s*!?:\s*", re.I)
          LABELS = {"feat": "**New feature** — ", "feature": "**New feature** — ",
                    "fix": "**Fix** — ", "perf": "**Performance** — ",
                    "refactor": "**Change** — ", "build": "**Build** — ", "ci": "**Build** — ",
                    "docs": "**Docs** — ", "chore": "**Chore** — ", "style": "**Chore** — ",
                    "test": "**Tests** — "}

          def bullet(subj, sha):
              m = PREFIX.match(subj)
              return (LABELS[m.group(1).lower()] + subj[m.end():].strip() + f" ({sha})") if m else f"{subj} ({sha})"

          bullets = [bullet(s, h) for s, h in commits] or [f"Maintenance release {html.escape(version)}"]

          # version.props -> csproj đọc khi pack (releaseNotes trong nuspec trên nuget.org)
          with open("version.props", "w", encoding="utf-8") as f:
              f.write("<Project>\n  <PropertyGroup>\n")
              f.write(f"    <Version>{html.escape(version)}</Version>\n")
              f.write("    <PackageReleaseNotes>\n" + "\n".join(html.escape(f"{s} ({h})", quote=False) for s, h in commits) + "\n    </PackageReleaseNotes>\n")
              f.write("  </PropertyGroup>\n</Project>\n")

          # release-notes.md -> GitHub Release
          body = [f"## What's changed in {version}", ""]
          body += [f"- {b}" for b in bullets]
          body += ["", "## NuGet",
                   f"Install: `dotnet add package VietQR.Core --version {version}`",
                   f"Package page: https://www.nuget.org/packages/VietQR.Core/{version}",
                   "", "## Downloads",
                   "`.nupkg` file is attached below — or install directly from [nuget.org](https://www.nuget.org/packages/VietQR.Core)."]
          with open("release-notes.md", "w", encoding="utf-8") as f:
              f.write("\n".join(body) + "\n")
          PY

      - name: Pack
        run: dotnet pack src/VietQR.Core/VietQR.Core.csproj -c Release -p:Version=$VERSION -p:ContinuousIntegrationBuild=true -o ./nupkgs

      - name: Verify package content
        run: |
          unzip -p ./nupkgs/VietQR.Core.$VERSION.nupkg VietQR.Core.nuspec | grep '<releaseNotes>'
          unzip -l ./nupkgs/VietQR.Core.$VERSION.nupkg | grep -E 'README.md|docs/image/(qr_only|compact|print).png'
          unzip -l ./nupkgs/VietQR.Core.$VERSION.snupkg | grep -E '\.pdb'

      - uses: NuGet/login@v1
        id: login
        with:
          user: hiendev.official

      - name: Push to NuGet
        run: |
          dotnet nuget push ./nupkgs/*.nupkg \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Release (nupkg asset)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$VERSION đã tồn tại (re-run) — cập nhật notes + asset."
            gh release upload "v$VERSION" -R "$GITHUB_REPOSITORY" ./nupkgs/*.nupkg ./nupkgs/*.snupkg --clobber
            gh release edit "v$VERSION" -R "$GITHUB_REPOSITORY" --notes-file release-notes.md --latest
          else
            gh release create "v$VERSION" -R "$GITHUB_REPOSITORY" \
              --title "v$VERSION" --latest --notes-file release-notes.md ./nupkgs/*.nupkg ./nupkgs/*.snupkg
          fi
