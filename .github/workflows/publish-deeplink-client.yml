name: Publish VietQR.Deeplink.Client to NuGet

on:
  push:
    branches: [main]
    paths:
      - 'src/VietQR.Deeplink.Client/**'
    tags: ["client-v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: 'Manual version override (e.g. 1.0.0). Để trống sẽ tự tính theo Git tag/csproj'
        required: false
        default: ''

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version + release notes
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/client-v* ]]; then
            # Đã có tag client-v*.*.* thủ công -> dùng đúng version đó
            VERSION="${GITHUB_REF#refs/tags/client-v}"
          else
            # Tính version kế tiếp: major.minor từ csproj, patch = tag client-v cuối + 1
            MAJMIN=$(awk -F'[<>]' '/<Version>/{print $3; exit}' src/VietQR.Deeplink.Client/VietQR.Deeplink.Client.csproj | cut -d. -f1-2)
            LAST=$(git describe --tags --match "client-v[0-9]*" --abbrev=0 2>/dev/null | sed 's/^client-v//' || true)
            if [ -z "$LAST" ]; then
              # Chưa có tag nào -> lấy version khởi điểm từ csproj (mặc định 1.0.0)
              CSPROJ_VER=$(awk -F'[<>]' '/<Version>/{print $3; exit}' src/VietQR.Deeplink.Client/VietQR.Deeplink.Client.csproj)
              VERSION="${CSPROJ_VER:-1.0.0}"
            elif [[ "$LAST" == "${MAJMIN}."* ]]; then
              VERSION="${MAJMIN}.$(( ${LAST##*.} + 1 ))"
            else
              # Tag cuối thuộc major.minor khác (đã đổi trong csproj) -> chạm mốc mới .0
              VERSION="${MAJMIN}.0"
            fi
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          # Commit kể từ tag client TRƯỚC (chỉ lấy commit trong thư mục client)
          LAST_TAG=$(git describe --tags --match "client-v[0-9]*" --abbrev=0 2>/dev/null || true)
          if [ -n "$LAST_TAG" ] && git rev-list "$LAST_TAG..HEAD" >/dev/null 2>&1; then
            LOG=$(git log "$LAST_TAG..HEAD" --max-count=30 --pretty=format:'%s%n%h' -- src/VietQR.Deeplink.Client)
          else
            LOG=$(git log --max-count=10 --pretty=format:'%s%n%h' -- src/VietQR.Deeplink.Client)
          fi
          if [ -z "$LOG" ]; then
            LOG=$(git log -1 --pretty=format:'%s%n%h')
          fi

          VERSION="$VERSION" LOG="$LOG" python3 - <<'PY'
          import html, os, re

          version = os.environ["VERSION"]
          raw = [l for l in os.environ.get("LOG", "").splitlines() if l.strip()]
          commits = [(raw[i].strip(), raw[i + 1].strip()) for i in range(0, len(raw) - 1, 2)]

          PREFIX = re.compile(r"^(feat|feature|fix|perf|refactor|build|ci|docs|chore|style|test)(\([^)]*\))?\s*!?:\s*", re.I)
          LABELS = {"feat": "**New feature** — ", "feature": "**New feature** — ",
                    "fix": "**Fix** — ", "perf": "**Performance** — ",
                    "refactor": "**Change** — ", "build": "**Build** — ", "ci": "**Build** — ",
                    "docs": "**Docs** — ", "chore": "**Chore** — ", "style": "**Chore** — ",
                    "test": "**Tests** — "}

          def bullet(subj, sha):
              m = PREFIX.match(subj)
              return (LABELS[m.group(1).lower()] + subj[m.end():].strip() + f" ({sha})") if m else f"{subj} ({sha})"

          bullets = [bullet(s, h) for s, h in commits] or [f"Release VietQR.Deeplink.Client {html.escape(version)}"]

          # version.props -> csproj đọc khi pack (releaseNotes trong nuspec trên nuget.org)
          with open("version.props", "w", encoding="utf-8") as f:
              f.write("<Project>\n  <PropertyGroup>\n")
              f.write(f"    <Version>{html.escape(version)}</Version>\n")
              f.write("    <PackageReleaseNotes>\n" + "\n".join(html.escape(f"{s} ({h})", quote=False) for s, h in commits) + "\n    </PackageReleaseNotes>\n")
              f.write("  </PropertyGroup>\n</Project>\n")

          # release-notes.md -> GitHub Release
          body = [f"## What's changed in VietQR.Deeplink.Client v{version}", ""]
          body += [f"- {b}" for b in bullets]
          body += ["", "## NuGet",
                   f"Install: `dotnet add package VietQR.Deeplink.Client --version {version}`",
                   f"Package page: https://www.nuget.org/packages/VietQR.Deeplink.Client/{version}",
                   "", "## Downloads",
                   "`.nupkg` and `.snupkg` files are attached below — or install directly from [nuget.org](https://www.nuget.org/packages/VietQR.Deeplink.Client)."]
          with open("release-notes.md", "w", encoding="utf-8") as f:
              f.write("\n".join(body) + "\n")
          PY

      - name: Pack
        run: dotnet pack src/VietQR.Deeplink.Client/VietQR.Deeplink.Client.csproj -c Release -p:Version=$VERSION -p:ContinuousIntegrationBuild=true -o ./nupkgs

      - name: Verify package content
        run: |
          unzip -p ./nupkgs/VietQR.Deeplink.Client.$VERSION.nupkg VietQR.Deeplink.Client.nuspec | grep '<releaseNotes>'
          unzip -l ./nupkgs/VietQR.Deeplink.Client.$VERSION.nupkg | grep -E 'README.md'
          unzip -l ./nupkgs/VietQR.Deeplink.Client.$VERSION.snupkg | grep -E '\.pdb'

      - uses: NuGet/login@v1
        id: login
        with:
          user: hiendev.official

      - name: Push to NuGet
        run: |
          dotnet nuget push ./nupkgs/*.nupkg \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Release (nupkg asset)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="client-v$VERSION"
          if gh release view "$TAG_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG_NAME đã tồn tại (re-run) — cập nhật notes + asset."
            gh release upload "$TAG_NAME" -R "$GITHUB_REPOSITORY" ./nupkgs/*.nupkg ./nupkgs/*.snupkg --clobber
            gh release edit "$TAG_NAME" -R "$GITHUB_REPOSITORY" --notes-file release-notes.md
          else
            gh release create "$TAG_NAME" -R "$GITHUB_REPOSITORY" \
              --title "VietQR.Deeplink.Client v$VERSION" --notes-file release-notes.md ./nupkgs/*.nupkg ./nupkgs/*.snupkg
          fi

